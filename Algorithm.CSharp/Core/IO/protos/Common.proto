syntax = "proto3";
package QuantConnect.Algorithm.CSharp.Core.IO;

option csharp_namespace = "QuantConnect.Algorithm.CSharp.Core.IO";

message Holding {

  string symbol = 1;
  float quantity = 2;
  SecurityType security_type = 3;
}

message OptionQuote {

  float bid = 1;
  float ask = 2;
}

message Trade {
   
    string ts = 1;
    string symbol = 2;
    SecurityType security_type = 3;
    float price = 4;
    float price_underlying = 5;
}

message Quote {
   
    string ts = 1;
    string symbol = 2;
    SecurityType security_type = 3;
    float bid = 4;
    float ask = 5;
    float price_underlying = 6;
    
}

message Quotes {

    string symbol = 1;
    SecurityType security_type = 2;
    repeated Quote quotes = 3;
}

message Trades {

    string symbol = 1;
    SecurityType security_type = 2;
    repeated Trade trades = 3;
}

message MarketDataHistory {

    string ts = 1;
    string ts_start = 2;
    string ts_end = 3;
    string underlying = 4;
    map<string, Quotes> quotes = 5;
    map<string, Trades> trades = 6;
}

enum OptionRight {

    CALL = 0;
    PUT = 1;
}

enum SecurityType {

    EQUITY = 0;
    OPTION = 1;
}

message MarketDataSnapByUnderlying {

  string ts = 1;
  string underlying = 2;
  float underlying_price = 3;
  map<string, OptionQuote> option_quotes = 4;
}

message VectorDouble
{
    repeated double values = 1;    
}
